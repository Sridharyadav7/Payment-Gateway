spring:
  application:
    name: Payment-Gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentGateway}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
